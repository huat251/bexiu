<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - BEXIU.STU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave&family=Gelasio:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="product-hero-section">
        <div class="product-hero-background"></div>
        
        <!-- Navigation -->
        <div id="nav-placeholder"></div>

    </div>

    <!-- Product Content Section -->
    <section class="product-content">
        <div class="container">
            <h2>Gia Đình "Bé Xíu"</h2>
            <div class="product-grid">
                <!-- Product items will go here -->
            </div>
        </div>
    </section>

    <!-- Card Showcase Section -->
    <section class="card-showcase-section">
        <div class="card-showcase-container" id="cardShowcaseContainer">
            <!-- Cards will be dynamically generated from products-data.js -->
        </div>
    </section>

    <section class="product-gallery-carousel-section" aria-label="Product gallery carousel">
        <div class="product-gallery-carousel-wrap">
            <div class="product-gallery-carousel-track">
                <figure class="product-gallery-item">
                    <img src="images/product/fg1.jpg" alt="Bé Xíu product artwork 1" loading="lazy">
                </figure>
                <figure class="product-gallery-item">
                    <img src="images/product/fg2.jpg" alt="Bé Xíu product artwork 2" loading="lazy">
                </figure>
                <figure class="product-gallery-item">
                    <img src="images/product/fg3.jpg" alt="Bé Xíu product artwork 3" loading="lazy">
                </figure>
                <figure class="product-gallery-item">
                    <img src="images/product/kch1.jpeg" alt="Bé Xíu product process 1" loading="lazy">
                </figure>
                <figure class="product-gallery-item">
                    <img src="images/product/kch2.jpeg" alt="Bé Xíu product process 2" loading="lazy">
                </figure>
                <figure class="product-gallery-item">
                    <img src="images/product/kch3.jpeg" alt="Bé Xíu product process 3" loading="lazy">
                </figure>

                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/fg1.jpg" alt="" loading="lazy">
                </figure>
                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/fg2.jpg" alt="" loading="lazy">
                </figure>
                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/fg3.jpg" alt="" loading="lazy">
                </figure>
                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/kch1.jpeg" alt="" loading="lazy">
                </figure>
                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/kch2.jpeg" alt="" loading="lazy">
                </figure>
                <figure class="product-gallery-item" aria-hidden="true">
                    <img src="images/product/kch3.jpeg" alt="" loading="lazy">
                </figure>
            </div>
        </div>
    </section>

    <!-- Product Detail Overlay -->
    <div class="product-overlay" id="productOverlay">
        <div class="overlay-content">
            <button class="overlay-close" id="overlayClose">&times;</button>
            <div class="overlay-body">
                <div class="overlay-image-section">
                    <div class="overlay-image-main">
                        <img id="overlayImage" src="" alt="Product">
                    </div>
                    <div class="overlay-image-thumbnails" id="overlayThumbnails">
                        <!-- Thumbnails will be dynamically generated -->
                    </div>
                </div>
                <div class="overlay-details">
                    <span class="overlay-tag" id="overlayTag"></span>
                    <h2 class="overlay-title" id="overlayTitle"></h2>
                    <p class="overlay-price" id="overlayPrice"></p>
                    <p class="overlay-description" id="overlayDescription"></p>
                    <div class="overlay-features">
                        <h3>Đặc điểm:</h3>
                        <ul id="overlayFeatures"></ul>
                    </div>
                    <button class="overlay-order-btn">SỞ HỮU NGAY</button>
                </div>
            </div>
        </div>
    </div>

    <script src="products-data.js"></script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
