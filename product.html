<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - BEXIU.STU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave&family=Gelasio:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="product-hero-section">
        <div class="product-hero-background"></div>
        
        <!-- Navigation -->
        <div id="nav-placeholder"></div>

    </div>

    <!-- Product Content Section -->
    <section class="product-content">
        <div class="container">
            <h2>Gia Đình "Bé Xíu"</h2>
            <div class="product-grid">
                <!-- Product items will go here -->
            </div>
        </div>
    </section>

    <!-- Card Showcase Section -->
    <section class="card-showcase-section">
        <div class="card-showcase-container" id="cardShowcaseContainer">
            <!-- Cards will be dynamically generated from products-data.js -->
        </div>
    </section>
        <!-- Footer -->
    <div id="footer-placeholder"></div>
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon" aria-label="Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="2" y="2" width="20" height="20" rx="5" stroke="black" stroke-width="2"/>
                            <circle cx="12" cy="12" r="4" stroke="black" stroke-width="2"/>
                            <circle cx="17.5" cy="6.5" r="1.5" fill="black"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Divider -->
            <div class="footer-divider"></div>

            <!-- Bottom Section -->
            <div class="footer-bottom">
                <div class="footer-links">
                    <a href="#">Term of Services</a>
                    <a href="#">Privacy Policy</a>
                </div>
                <div class="footer-copyright">
                    © 2026 Bexiu.stu. All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <!-- Product Detail Overlay -->
    <div class="product-overlay" id="productOverlay">
        <div class="overlay-content">
            <button class="overlay-close" id="overlayClose">&times;</button>
            <div class="overlay-body">
                <div class="overlay-image-section">
                    <div class="overlay-image-main">
                        <img id="overlayImage" src="" alt="Product">
                    </div>
                    <div class="overlay-image-thumbnails" id="overlayThumbnails">
                        <!-- Thumbnails will be dynamically generated -->
                    </div>
                </div>
                <div class="overlay-details">
                    <span class="overlay-tag" id="overlayTag"></span>
                    <h2 class="overlay-title" id="overlayTitle"></h2>
                    <p class="overlay-description" id="overlayDescription"></p>
                    <div class="overlay-features">
                        <h3>Đặc điểm:</h3>
                        <ul id="overlayFeatures"></ul>
                    </div>
                    <button class="overlay-order-btn">SỞ HỮU NGAY</button>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="products-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
